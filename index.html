<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY PROTOCOL</title><style>body{background:#10141b;color:#f4f7fb;font:16px Arial;padding:18px;max-width:700px;margin:auto}section{background:#1b222d;padding:16px;border-radius:14px;margin:12px 0}button,input,select{background:#263241;color:white;border:1px solid #526174;border-radius:8px;padding:10px;margin:4px}input{max-width:120px}small{color:#9aa7b7}.item{padding:12px;border-bottom:1px solid #394454}h1{color:#75b8ff}</style><h1>MY PROTOCOL</h1><p>Мій особистий журнал</p><section><h3>Додати позицію</h3><input id="n" placeholder="Назва"><input id="d" placeholder="Дозування"><select id="u"><option>мг</option><option>мкг</option><option>МО</option><option>мл</option><option>г</option></select><button onclick="add()">Додати</button></section><section><h3>Мій протокол</h3><div id="list"></div></section><script>let a=JSON.parse(localStorage.protocol||"[]");function save(){localStorage.protocol=JSON.stringify(a);render()}function add(){let n=document.getElementById("n").value,d=document.getElementById("d").value,u=document.getElementById("u").value;if(!n||!d)return alert("Вкажи назву та дозування");a.push({n,d,u,done:false});document.getElementById("n").value="";document.getElementById("d").value="";save()}function render(){document.getElementById("list").innerHTML=a.map((x,i)=>`<div class="item"><input type="checkbox" ${x.done?"checked":""} onchange="a[${i}].done=this.checked;save()"><b>${x.n}</b> — ${x.d} ${x.u}<button onclick="edit(${i})">Змінити</button><button onclick="a.splice(${i},1);save()">Видалити</button></div>`).join("")||"<small>Поки немає записів</small>"}function edit(i){let d=prompt("Нове дозування",a[i].d);if(d!==null){a[i].d=d;save()}}render();</script></html>
